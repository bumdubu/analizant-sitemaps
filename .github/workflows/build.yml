name: hreflang sitemap

on:
  schedule:
    - cron: '23 1 * * *'   # hər gün 05:23 Bakı vaxtı
  workflow_dispatch:        # "Run workflow" düyməsi ilə dərhal işə salmaq üçün
  push:
    paths: ['pages.json', 'build.mjs', '.github/workflows/build.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Asılılıq (HTML oxuyucu)
        run: npm install --no-save --no-package-lock linkedom@0.18.5
      - name: Sitemap və ana səhifə indeksini qur
        run: node build.mjs
        env:
          SITE: https://www.analizant.com
      - name: Dəyişikliyi yaz
        run: |
          git config user.name "analizant-bot"
          git config user.email "analizant-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "sitemap yeniləndi" && git push)
